<svg xmlns="http://www.w3.org/2000/svg" width="840" height="92" viewBox="0 0 840 92" role="img" aria-label="Gath uses SHA3-256 proof of work, a target block time of about 45 seconds, a supply cap of 20,999,999.727 Gath, and ML-DSA-44 signatures.">
  <rect width="840" height="92" fill="#000000"/>
  <line x1="0" y1="0.75" x2="840" y2="0.75" stroke="#c49a5a" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="91.25" x2="840" y2="91.25" stroke="#c49a5a" stroke-width="1" opacity="0.5"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="105" y="40" fill="#f2f2f2" font-size="16" font-weight="500" letter-spacing="0.02em">SHA3-256</text>
    <text x="105" y="62" fill="#a3a3a3" font-size="11" letter-spacing="0.08em">PROOF OF WORK</text>
    <text x="315" y="40" fill="#f2f2f2" font-size="16" font-weight="500" letter-spacing="0.02em">About 45 seconds</text>
    <text x="315" y="62" fill="#a3a3a3" font-size="11" letter-spacing="0.08em">BLOCK TIME</text>
    <text x="525" y="40" fill="#f2f2f2" font-size="16" font-weight="500" letter-spacing="0.02em">20,999,999.727</text>
    <text x="525" y="62" fill="#a3a3a3" font-size="11" letter-spacing="0.08em">SUPPLY CAP</text>
    <text x="735" y="40" fill="#f2f2f2" font-size="16" font-weight="500" letter-spacing="0.02em">ML-DSA-44</text>
    <text x="735" y="62" fill="#a3a3a3" font-size="11" letter-spacing="0.08em">SIGNATURES</text>
  </g>
  <g stroke="#c49a5a" stroke-width="0.6" opacity="0.35">
    <line x1="210" y1="28" x2="210" y2="68"/>
    <line x1="420" y1="28" x2="420" y2="68"/>
    <line x1="630" y1="28" x2="630" y2="68"/>
  </g>
</svg>
